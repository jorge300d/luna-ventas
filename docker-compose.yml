# Para correr todo en local: docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lunaventas
      POSTGRES_USER: luna
      POSTGRES_PASSWORD: luna123
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  api:
    build: ./backend
    depends_on: [db]
    environment:
      DB_URL: jdbc:postgresql://db:5432/lunaventas
      DB_USER: luna
      DB_PASSWORD: luna123
      CORS_ORIGINS: http://localhost:4200
      ADMIN_KEY: cambiar-esta-clave
    ports: ["8080:8080"]

volumes:
  pgdata:
