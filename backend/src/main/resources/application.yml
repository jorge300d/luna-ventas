server:
  port: ${PORT:8080}
  error:
    include-message: always

spring:
  application:
    name: luna-ventas-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lunaventas}
    username: ${DB_USER:luna}
    password: ${DB_PASSWORD:luna123}
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  # correo para la constancia del Libro de Reclamaciones (ej. Gmail con contraseña de aplicación)
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  # separar varios con coma
  cors-origins: ${CORS_ORIGINS:http://localhost:4200}
  admin-key: ${ADMIN_KEY:}
  sitio-url: ${SITIO_URL:https://lunaventas.vercel.app}
  ofertas-auto: ${OFERTAS_AUTO:true}
  politica-version: "2026-10"
  proveedor-nombre: ${PROVEEDOR_NOMBRE:Luna Ventas}
  proveedor-ruc: ${PROVEEDOR_RUC:}
  proveedor-domicilio: ${PROVEEDOR_DOMICILIO:Av. Arenales 1487, Stand 1, Lince, Lima}
  correo-remitente: ${MAIL_USER:}
  correo-negocio: ${CORREO_NEGOCIO:}

# se llena cuando se conecte la API de WhatsApp de Meta; vacío = modo gratis (links manuales)
whatsapp:
  proveedor: ${WA_PROVEEDOR:meta}   # meta | 360dialog
  token: ${WA_TOKEN:}
  phone-id: ${WA_PHONE_ID:}
  verify-token: ${WA_VERIFY_TOKEN:}
  app-secret: ${WA_APP_SECRET:}
  webhook-clave: ${WA_WEBHOOK_CLAVE:}
  plantilla: ${WA_PLANTILLA:oferta_luna}
  idioma: ${WA_IDIOMA:es}

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
