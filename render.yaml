# Blueprint de Render para el backend. La base de datos está en Neon.
services:
  - type: web
    name: luna-ventas-api
    runtime: docker
    rootDir: backend
    plan: free
    region: virginia
    healthCheckPath: /actuator/health
    envVars:
      # servidor y usuario de Neon (no son secretos)
      - key: DB_URL
        value: jdbc:postgresql://ep-silent-unit-b7gh6z5d.c-13.us-east-1.aws.neon.tech/neondb?sslmode=require
      - key: DB_USER
        value: neondb_owner
      # la contraseña de Neon, o la "connection string" completa (postgresql://...)
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://lunaventas.vercel.app,https://jorge300d.github.io
      - key: SITIO_URL
        value: https://lunaventas.vercel.app
      # clave del panel; Render la genera sola
      - key: ADMIN_KEY
        generateValue: true
